<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sheet Counter</title>


<link rel="stylesheet" href="assets/css/style.css">


</head>


<body>


<div class="container">


<h1>
Sheet Counter
</h1>


<p>
Pilih Jenis Flute Corrugated
</p>



<div class="flutes">


<button 
class="flute active"
data-value="3">

B Flute

<br>

<span>
3 mm
</span>

</button>



<button 
class="flute"
data-value="4">

C Flute

<br>

<span>
4 mm
</span>

</button>




<button 
class="flute"
data-value="6.4">

BC Flute

<br>

<span>
6.4 mm
</span>

</button>


</div>




<div class="card">


<label>
Tinggi Tumpukan Manual
</label>


<input

type="number"

id="height"

placeholder="Contoh: 865 mm"


>


</div>




<button id="startMeasure">


Mulai Ukur AR


</button>




<button id="calculate">


Hitung Manual


</button>




<div class="result">


<h2 id="sheetResult">

0 Sheet

</h2>


</div>



</div>





<script src="assets/js/calculator.js"></script>

<script src="assets/js/app.js"></script>



</body>


</html>
