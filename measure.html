<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
  <title>Sheet Counter AR</title>
  <link rel="stylesheet" href="assets/css/measure.css">
</head>
<body>

  <!-- Tempat AR Canvas muncul -->

  <!-- Panel informasi bawah -->
  <div class="panel">
    <h2>Sheet Counter AR</h2>

    <div class="status">
      <p id="status">Menunggu kamera...</p>
    </div>

    <div class="measurement">
      <div>
        <span>Tinggi</span>
        <h1 id="distance">0 mm</h1>
      </div>

      <div>
        <span>Jumlah Sheet</span>
        <h1 id="sheet">0</h1>
      </div>
    </div>

    <button id="reset">Reset</button>
  </div>

  <script type="module" src="assets/js/measure.js"></script>
</body>
</html>
